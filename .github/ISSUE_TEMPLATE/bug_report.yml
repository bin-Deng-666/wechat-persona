name: Bug report
description: Something is broken, or a message is silently lost.
title: 'bug: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two minutes of detail here saves a long back-and-forth.

        **Never paste credentials.** Redact `account.json`, bot tokens, QR codes,
        session cookies and any private chat content before attaching logs.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before filing
      options:
        - label: I read docs/README.md and the troubleshooting steps.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability (those go to Security Advisories).
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Where does the problem show up?
      multiple: true
      options:
        - Login / QR / session expiry
        - Receiving messages (long polling)
        - Sending text or splitting into multiple messages
        - Images / GIF / stickers
        - Persona system prompt
        - Memory (/记住)
        - Files / approval / stop
        - Setup / plugin install / profile
        - Panel or web routes
        - Documentation
        - Other

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour, including the exact WeChat messages you sent and received.
      placeholder: |
        I sent "你好" and got no reply. The log shows "投递给模型失败".
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Fresh install of the plugin
        2. npm run login, scan the QR
        3. Send "菜单"
        4. See error
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From package.json or the installed package.
      placeholder: 0.2.0-dev.0
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: From the desktop app's About window, or `dsh --version`.
      placeholder: 0.2.0-rc.1
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.19.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.6.2 (arm64)
    validations:
      required: true

  - type: dropdown
    id: permission
    attributes:
      label: Session permission preset
      description: The `permission` value the plugin runs with.
      options:
        - danger-full-access
        - workspace-write
        - read-only
        - unknown

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `~/.dsh/wechat-persona/logs/plugin-YYYY-MM-DD.log`.
        Redact token values, QR payloads and private chat text.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, workarounds you tried, or a suspicion about the cause.
